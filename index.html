<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cruciverba · Italian Verbs</title>
<style>
:root{--bg:#faf7f2;--fg:#1d1b18;--mut:#6b655c;--cell:#fff;--blk:#1d1b18;--line:#cfc7ba;--sel:#ffd966;--word:#fff0bf;--acc:#2f7d4f;--bad:#c8443a;--key:#e8e2d6;--hint:#d62b2b;--hintbg:#ffdcd8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--fg:#f1ece2;--mut:#a39b8c;--cell:#26231c;--blk:#0c0b08;--line:#4a453a;--sel:#b8891a;--word:#4a3f1c;--key:#3a362c;--hint:#ff8a80;--hintbg:#5a2420;--acc:#5fbf86;--bad:#e2685d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16140f;--fg:#f1ece2;--mut:#a39b8c;--cell:#26231c;--blk:#0c0b08;--line:#4a453a;--sel:#b8891a;--word:#4a3f1c;--key:#3a362c;--hint:#ff8a80;--hintbg:#5a2420;--acc:#5fbf86;--bad:#e2685d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:12px 12px 0}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font:700 22px Georgia,serif;margin:0}
.meta{color:var(--mut);font-size:13px;text-align:right}
#grid{display:grid;gap:2px;margin:12px auto;width:100%;background:var(--bg)}
#grid div{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(14px,5vw,22px);text-transform:uppercase}
#grid .b{background:transparent}
#grid .c{background:var(--cell);border:1px solid var(--line);border-radius:3px;cursor:pointer;user-select:none}
#grid .w{background:var(--word)}
#grid .s{background:var(--sel)}
#grid .ok{color:var(--acc)}
#grid .h{color:var(--hint)}
#grid .c.h:not(.s):not(.w){background:var(--hintbg)}
#grid i{position:absolute;top:1px;left:3px;font:600 9px/1 sans-serif;color:var(--mut)}
.dock{position:sticky;bottom:0;background:var(--bg);padding:8px 0 10px;border-top:1px solid var(--line)}
#bar{min-height:40px;font-weight:600;margin-bottom:6px}
#bar span{color:var(--mut);font-weight:700;margin-right:6px}
.row{display:flex;gap:4px;justify-content:center;margin-bottom:4px}
.row button{flex:1;max-width:42px;height:42px;border:0;border-radius:6px;background:var(--key);color:var(--fg);font:600 17px sans-serif;touch-action:manipulation}
.tools{display:flex;gap:8px;margin-bottom:8px}
.tools button{flex:1;height:38px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:600 14px sans-serif}
#msg{text-align:center;color:var(--acc);font-weight:700;min-height:20px;margin:0 0 6px}
#tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
#tabs button{flex:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:16px;padding:6px 12px;font:600 13px sans-serif}
#tabs .on{background:var(--sel)}
h2{font:700 15px sans-serif;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
ol{list-style:none;margin:0;padding:0}
li{padding:7px 8px;border-radius:6px;cursor:pointer}
li b{display:inline-block;min-width:26px}
li.on{background:var(--word)}
[hidden]{display:none!important}
#back,#sback{border:0;background:none;color:var(--fg);font:600 15px sans-serif;padding:4px 0}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.av{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--cell);font-size:28px;padding:0}
#hello{font:700 20px Georgia,serif}
.mut{color:var(--mut);font-size:13px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats div{flex:1;background:var(--cell);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--mut)}
.feat{width:100%;border:0;border-radius:14px;padding:16px;background:var(--acc);color:var(--bg);font:700 16px sans-serif;text-align:left}
.feat:disabled{opacity:.7}
#cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--cell);color:var(--fg);border-radius:14px;padding:10px 12px;font-family:inherit}
.card .ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--word);display:flex;align-items:center;justify-content:center;font:700 13px sans-serif}
.card .tx{flex:1}
.card .tx b{display:block;font-size:15px}
.card small{color:var(--mut);font-size:13px}
.card .stt{font:700 13px sans-serif;color:var(--acc)}
.card.new .stt{color:var(--fg)}
#prof{background:var(--cell);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
#prof input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px;margin-bottom:8px}
#avs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#avs button{width:40px;height:40px;font-size:22px;border:1px solid var(--line);border-radius:10px;background:transparent;padding:0}
#avs .on{background:var(--sel)}
#psave{padding:8px 16px;border:0;border-radius:8px;background:var(--acc);color:var(--bg);font-weight:700}
.ch{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ch b{flex:1;text-align:center}
.ch button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:6px 10px;font-weight:600}
.ch button:disabled{opacity:.3}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg i{font:600 12px sans-serif;color:var(--mut);font-style:normal}
.cg .d{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--cell);color:var(--fg);font:600 14px sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.cg .d small{font-size:9px;color:var(--mut)}
.cg .d:disabled{opacity:.3}
.cg .part{background:var(--word)}
.cg .full{background:var(--acc);color:var(--bg)}
.cg .full small{color:var(--bg)}
.cg .td{border-color:var(--acc);border-width:2px}
.cg .sel{outline:2px solid var(--fg);outline-offset:1px}
.unit{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--cell);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.unit.lock{opacity:.6}
.unit .ut{flex:1;min-width:0}
.unit .ut b{font-size:14px}
.unit small{display:block;color:var(--mut);font-size:12px}
.unit i{display:block;height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.unit i span{display:block;height:100%;background:var(--acc)}
.unit button{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:600 13px sans-serif}
.unit button:disabled{opacity:.45}
.sl{margin:14px 0;font-size:18px;line-height:1.9}
.wd{border:0;background:none;color:var(--fg);font:inherit;padding:0 1px;cursor:pointer}
.wd.nw{border-bottom:2px dotted var(--mut)}
.tr{display:block;color:var(--mut);font-size:14px;line-height:1.4}
#sgloss{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;font-weight:600}
#strans{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:600 14px sans-serif}
footer{height:24px}
</style></head>

<div id="home">
<div class="hd"><button id="avatar" class="av">🙂</button><div><div id="hello"></div><div id="hdate" class="mut"></div></div></div>

<footer></footer>
</div>

<div id="grid"></div>
<div class="dock">
<p id="msg"></p>
<div id="bar"></div>

<div id="kb"></div>
</div>

<footer></footer>
</div>
<div id="story" hidden>
<button id="sback">‹ Home</button>

<button id="strans">Show translation</button>
<div id="slines"></div>
<div id="sgloss">Tap any word to see its meaning.</div>
<footer></footer>
</div>
</main>

/* Seeded RNG (mulberry32) so the same date always gives the same puzzle */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* Generator: returns {entries, cells} for a given date key */
function generate(key,list){
  const R=rng(hash(key)),N=44;
  const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const picked=shuffle(list).slice(0,24),pool=picked.filter(o=>o.word.length>1),loners=picked.filter(o=>o.word.length<2);
  let best=null;
  for(let t=0;t<200;t++){
    const g=Array.from({length:N},()=>Array(N).fill("")),dm=Array.from({length:N},()=>Array(N).fill(0)),placed=[];
    const put=(o,r,c,d)=>{for(let i=0;i<o.word.length;i++){const rr=r+(d?i:0),cc=c+(d?0:i);g[rr][cc]=o.word[i];dm[rr][cc]|=1<<d}placed.push({...o,r,c,d})};
    const chk=(w,r,c,d)=>{const dr=d,dc=1-d,L=w.length;
      if(r<2||c<2||r+dr*L>N-2||c+dc*L>N-2)return -1;
      if(g[r-dr][c-dc]||g[r+dr*L][c+dc*L])return -1;
      let x=0;
      for(let i=0;i<L;i++){const rr=r+dr*i,cc=c+dc*i,v=g[rr][cc];
        if(v){if(v!==w[i]||(dm[rr][cc]&(1<<d)))return -1;x++}
        else if(g[rr+dc][cc+dr]||g[rr-dc][cc-dr])return -1}
      return x};
    const order=shuffle(pool);
    const first=order.reduce((a,b)=>b.word.length>a.word.length&&R()<.6?b:a);
    put(first,N>>1,(N>>1)-(first.word.length>>1),0);
    for(const o of order){
      if(placed.length>=13)break;
      if(placed.some(p=>p.word===o.word))continue;
      const cand=[];let mx=0;
      for(const p of placed)for(let i=0;i<p.word.length;i++)for(let j=0;j<o.word.length;j++){
        if(p.word[i]!==o.word[j])continue;
        const nd=1-p.d,r=p.r+(p.d?i:0)-(nd?j:0),c=p.c+(p.d?0:i)-(nd?0:j),x=chk(o.word,r,c,nd);
        if(x>0){if(x>mx){mx=x;cand.length=0}if(x===mx)cand.push({r,c,d:nd})}}
      if(cand.length){const p=cand[Math.floor(R()*cand.length)];put(o,p.r,p.c,p.d)}
    }
    if(!best||placed.length>best.length)best=placed;
    if(best.length>=12)break;
  }
  const r0=Math.min(...best.map(p=>p.r)),c0=Math.min(...best.map(p=>p.c));
  const cells={},starts={};
  let H=0,W=0;
  for(const p of best){p.r-=r0;p.c-=c0;p.cells=[];
    for(let i=0;i<p.word.length;i++){const r=p.r+(p.d?i:0),c=p.c+(p.d?0:i),k=r+","+c;
      cells[k]=cells[k]||{ans:p.word[i],val:"",r,c};p.cells.push(k);H=Math.max(H,r+1);W=Math.max(W,c+1)}}
  /* one-letter answers (e.g. è) become stand-alone single-cell entries below the grid */
  loners.forEach(o=>{const r=H+1,c=0,k=r+","+c;cells[k]={ans:o.word,val:"",r,c};best.push({...o,r,c,d:0,cells:[k]});H=r+1;W=Math.max(W,1)});
  best.sort((a,b)=>a.r-b.r||a.c-b.c);
  let n=0;
  for(const p of best){const k=p.r+","+p.c;if(!starts[k])starts[k]=++n;p.num=starts[k];cells[k].num=p.num}
  return{entries:best,cells,H,W};
}

const NAMES={inf:"Infinitive",0:"io",1:"tu",2:"lui/lei",3:"noi",4:"voi",5:"loro"};
/* Section word list: the infinitives, or one conjugated person (0=io ... 5=loro), read from DATA */
function listFor(m){
  if(isU(m))return unitList(+m.slice(1));
  if(m==="inf")return DATA.map(x=>({word:x.word.toUpperCase(),clue:x.clue,id:"it.v."+x.word}));
  return DATA.map(x=>({word:x.forms[m].answer.toUpperCase(),clue:x.forms[m].clue,id:"it.v."+x.word,form:PERS[m]}));
}

/* App */
const $=id=>document.getElementById(id);
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=new Date(),TODAY=fmt(today);
let KEY=TODAY;
let mode="inf",entries,cells,H,W,wordAt,sel,dir,bad;
const progKey=()=>isU(mode)?"cv-prog-"+mode+"-"+rnd(mode):"cv-prog-"+KEY+(mode==="inf"?"":"-"+mode);
function load(m){
  mode=m;
  ({entries,cells,H,W}=generate(seedOf(m),listFor(m)));
  wordAt={};
  entries.forEach((e,i)=>e.cells.forEach(k=>{(wordAt[k]=wordAt[k]||[])[e.d]=i}));
  sel=entries[0].cells[0];dir=entries[0].d;bad=new Set();
  const prog=store(progKey());
  if(prog)for(const k in prog)if(cells[k]){cells[k].val=prog[k][0];cells[k].hint=prog[k].length>1}
  record();
  $("sub").textContent=subText(m);$("tabs").hidden=isU(m);$("again").hidden=true;fin=false;
  $("msg").textContent="";
  tabs();lists();render();
}
function tabs(){
  const dn=store("cv-done-"+KEY)||[],t=$("tabs");t.innerHTML="";
  ["inf",0,1,2,3,4,5].forEach(m=>{
    const b=document.createElement("button");
    b.textContent=NAMES[m]+(dn.includes(m)?" ✓":"");
    if(m===mode)b.className="on";
    b.onclick=()=>load(m);t.append(b);
  });
}

function store(k,v){try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const save=()=>{const o={};for(const k in cells)if(cells[k].val)o[k]=cells[k].val+(cells[k].hint?"!":"");store(progKey(),o);record()};

const cur=()=>{const i=wordAt[sel][dir];return i==null?null:entries[i]};
function pick(k){
  if(sel===k){if(wordAt[k][1-dir]!=null)dir=1-dir}
  else{sel=k;if(wordAt[k][dir]==null)dir=1-dir}
  render();
}
/* A word is locked (green, untouchable) once every letter is right. Wrong letters are never flagged. */
const locked=()=>{const s=new Set();entries.forEach(e=>{if(e.cells.every(k=>cells[k].val===cells[k].ans))e.cells.forEach(k=>s.add(k))});return s};
const done=en=>en.cells.every(k=>cells[k].val===cells[k].ans);
/* Jump to the next unfinished word (wraps around) */
function nextWord(from){
  const n=entries.length;
  for(let s=1;s<=n;s++){
    const en=entries[(from+s)%n];
    if(!done(en)){sel=en.cells.find(k=>cells[k].val!==cells[k].ans);dir=en.d;return}
  }
}
function type(ch){
  const e=cur(),ei=entries.indexOf(e);
  if(!locked().has(sel)){cells[sel].val=ch;cells[sel].hint=false}
  if(done(e))nextWord(ei);
  else{
    const L=locked();
    let i=e.cells.indexOf(sel)+1;
    while(i<e.cells.length&&L.has(e.cells[i]))i++;
    if(i<e.cells.length)sel=e.cells[i];
  }
  save();render();win();
}
function back(){
  const e=cur(),L=locked();let i=e.cells.indexOf(sel);
  if(!L.has(sel)&&cells[sel].val){cells[sel].val="";cells[sel].hint=false}
  else{i--;while(i>=0&&L.has(e.cells[i]))i--;if(i>=0){sel=e.cells[i];cells[sel].val="";cells[sel].hint=false}}
  save();render();
}
function win(){
  if(!Object.values(cells).every(c=>c.val===c.ans))return;
  $("msg").textContent="Complete! Bravo!";
  if(isU(mode)){unitDone();return}
  const dn=store("cv-done-"+KEY)||[];
  if(!dn.includes(mode)){dn.push(mode);store("cv-done-"+KEY,dn)}
  tabs();
  const s=store("cv-streak")||{last:"",n:0};
  if(KEY===TODAY&&s.last!==KEY){
    const y=new Date(today.getFullYear(),today.getMonth(),today.getDate()-1);
    s.n=s.last===fmt(y)?s.n+1:1;s.best=Math.max(s.best||0,s.n);s.last=KEY;store("cv-streak",s);
  }
  showStreak();
}
function liveStreak(){const s=store("cv-streak");if(!s)return 0;const y=new Date(today.getFullYear(),today.getMonth(),today.getDate()-1);return s.last===TODAY||s.last===fmt(y)?s.n:0}
function showStreak(){const n=liveStreak();$("streak").textContent=n?"Streak: "+n+" day"+(n>1?"s":""):""}

function render(){
  const g=$("grid");
  g.style.gridTemplateColumns="repeat("+W+",1fr)";
  g.style.maxWidth=Math.min(W*48,560)+"px";
  g.innerHTML="";
  const e=cur(),L=locked();
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const k=r+","+c,cell=cells[k],d=document.createElement("div");
    if(!cell){d.className="b"}
    else{
      d.className="c"+(sel===k?" s":e&&e.cells.includes(k)?" w":"")+(L.has(k)?" ok":"")+(cell.hint?" h":"");
      d.innerHTML=(cell.num?"<i>"+cell.num+"</i>":"")+cell.val;
      d.onclick=()=>pick(k);
    }

let C={},fin=false;
function setC(d){const L=Object.fromEntries(d.lex.map(e=>[e.id,e]));C={lex:d.lex,units:d.units.units,rule:d.units.unlock,stories:d.stories,L}}
setC(CONTENT_EMBED);
const J=p=>fetch(p).then(r=>r.ok?r.json():Promise.reject());
async function loadContent(){
  const l=await J("content/it/lexicon.json"),u=await J("content/it/units.json"),st={};
  for(const x of u.units)if(x.story)st[x.story]=await J("content/it/stories/"+x.story+".json");
  setC({lex:l.entries,units:u,stories:st});
}
const PERS=["pres.1sg","pres.2sg","pres.3sg","pres.1pl","pres.2pl","pres.3pl"];
const PL={n:"noun",adv:"adverb",pron:"pronoun",art:"article",prep:"preposition",conj:"conjunction",num:"number",adj:"adjective"};
const FORMD={pres:"present",inf:"dictionary form","1sg":"I","2sg":"you (sing.)","3sg":"he/she","1pl":"we","2pl":"you (pl.)","3pl":"they"};
const isU=m=>typeof m==="string"&&m[0]==="u";
const rnd=m=>(store("cv-rounds")||{})[m]||0;
const seedOf=m=>isU(m)?"unit|"+m+"|"+rnd(m):(PUZZLE_SET==="v1"?"":PUZZLE_SET+":")+(m==="inf"?KEY:KEY+"|"+m);
const subText=m=>isU(m)?"Unit "+m.slice(1)+" practice. Words you do not know yet come first.":m==="inf"?"Fill in the Italian infinitive for each English clue.":"Write the present-tense form for the person shown. Use the accent keys where needed (è, dà, può).";
const clueOf=e=>{const g=e.gloss[0].toUpperCase()+e.gloss.slice(1);return e.pos==="v"?g:g+(PL[e.pos]?" ("+PL[e.pos]+")":"")};
const unitWords=n=>C.units.find(u=>u.n===n).words.map(i=>C.L[i]).filter(e=>e&&e.puzzle!==false);
function unitList(n){
  const wk=store("cv-words")||{};
  return unitWords(n).slice().sort((a,b)=>(wk[a.id]===2)-(wk[b.id]===2)).slice(0,16)
    .map(e=>({word:e.lemma.replace(/ /g,"").toUpperCase(),clue:clueOf(e),id:e.id}));
}
/* A word counts as known (2) when solved without Hint; solved with Hint = learning (1). Stored by id, never by spelling. */
function record(){
  const wk=store("cv-words")||{};let ch=false;
  entries.forEach(e=>{
    if(!e.id||!e.cells.every(k=>cells[k].val===cells[k].ans))return;
    const key=e.form&&e.form!=="inf"?e.id+":"+e.form:e.id,v=e.cells.some(k=>cells[k].hint)?1:2;
    if((wk[key]||0)<v){wk[key]=v;ch=true}
  });
  if(ch)store("cv-words",wk);
}
function stat(n){const wk=store("cv-words")||{},ws=unitWords(n),k=ws.filter(e=>wk[e.id]===2).length;return{k,t:ws.length,ok:ws.length>0&&k/ws.length>=C.rule.threshold}}
function learn(){
  const box=$("units");box.innerHTML="";let K=0,T=0,prevOk=true;
  C.units.forEach(u=>{
    const s=stat(u.n),open=u.n===0||prevOk,storyOpen=!!u.story&&s.ok;K+=s.k;T+=s.t;
    const d=document.createElement("div");d.className="unit"+(open?"":" lock");
    d.innerHTML='<div class="ut"><b>Unit '+u.n+' \u00b7 '+u.title+'</b><small>'+s.k+' of '+s.t+' words known</small><i><span style="width:'+(s.t?Math.round(100*s.k/s.t):0)+'%"></span></i></div>';
    const a=document.createElement("button");a.textContent=open?"Practice":"\ud83d\udd12";a.disabled=!open;a.onclick=()=>openUnit(u.n);
    const b=document.createElement("button");b.textContent=u.story?(storyOpen?"Story":"\ud83d\udd12 Story"):"Story soon";b.disabled=!storyOpen;b.onclick=()=>openStory(u.story);
    d.append(a,b);box.append(d);prevOk=s.ok;
  });
  $("lsum").textContent="Foundation words known: "+K+" of "+T+" so far. A story unlocks when "+Math.round(C.rule.threshold*100)+"% of its unit is known (words revealed with Hint do not count).";
}
function openUnit(n,adv){
  const m="u"+n,R=store("cv-rounds")||{},F=store("cv-ufin")||{};
  if(adv||F[m+"-"+(R[m]||0)]){R[m]=(R[m]||0)+1;store("cv-rounds",R)}
  $("home").hidden=true;$("play").hidden=false;$("date").textContent="Unit "+n;
  load(m);showStreak();window.scrollTo(0,0);
}
function unitDone(){if(fin)return;fin=true;const F=store("cv-ufin")||{};F[mode+"-"+rnd(mode)]=1;store("cv-ufin",F);$("again").hidden=false}
function gloss(id,form,surf){
  const e=C.L[id];if(!e)return;let x="";
  if(form&&form[0]==="+")x=" ("+e.lemma+" + "+form.slice(1)+")";
  else if(form&&form!=="inf"){const [t,p]=form.split(".");x=" ("+e.lemma+" \u00b7 "+FORMD[t]+", "+FORMD[p]+")"}
  else if(e.lemma.toLowerCase()!==surf.toLowerCase())x=" ("+e.lemma+")";
  $("sgloss").textContent=surf+" \u2014 "+e.gloss+x;
}
function openStory(id){
  const s=C.stories[id];if(!s)return;
  $("home").hidden=true;$("play").hidden=true;$("story").hidden=false;
  $("stitle").textContent=s.title.it;$("sen").textContent=s.title.en;
  const wk=store("cv-words")||{},box=$("slines");box.innerHTML="";
  s.lines.forEach(ln=>{
    const p=document.createElement("p");p.className="sl";
    if(ln.speaker){const b=document.createElement("b");b.textContent=ln.speaker+": ";p.append(b)}
    const re=/\[([^\[\]|]+)\|([^\[\]|:]+)(?::([^\[\]]+))?\]/g,t=ln.it;let last=0,m;
    while((m=re.exec(t))){
      if(m.index>last)p.append(t.slice(last,m.index));
      const surf=m[1],wid=m[2],form=m[3];
      if(wid==="name")p.append(surf);
      else{const w=document.createElement("button");w.className="wd"+(wk[wid]===2?"":" nw");w.textContent=surf;w.onclick=()=>gloss(wid,form,surf);p.append(w)}
      last=re.lastIndex;
    }
    if(last<t.length)p.append(t.slice(last));
    const en=document.createElement("small");en.className="tr";en.hidden=true;en.textContent=ln.en;p.append(en);
    box.append(p);
  });
  $("strans").textContent="Show translation";$("sgloss").textContent="Tap any word to see its meaning.";
  window.scrollTo(0,0);
}
$("sback").onclick=home;
$("strans").onclick=()=>{const sh=$("strans").textContent.startsWith("Show");document.querySelectorAll("#slines .tr").forEach(x=>x.hidden=!sh);$("strans").textContent=sh?"Hide translation":"Show translation"};
$("again").onclick=()=>openUnit(+mode.slice(1),true);

/* ---- Home screen, calendar, local profile ---- */
const PUZZLE_SET="v1"; /* bump (e.g. "v2") only when you want brand-new puzzles for all dates */
const LAUNCH="2026-11-01"; /* earliest date shown in the calendar */
const MODES=["inf",0,1,2,3,4,5],WHO=["I","you (sing.)","he / she","we","you (pl.)","they"];
const AVS=["🙂","😎","🦊","🐱","🐼","🦉","🌻","🍋","🍕","🚀","🎨","🏔️"];
const DAYF={weekday:"long",day:"numeric",month:"long"};
let calM=new Date(today.getFullYear(),today.getMonth(),1),pav="🙂";
const pd=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const prof=()=>store("cv-profile")||{name:"",av:"🙂"};
const mlabel=m=>m==="inf"?"Infinitives":"Present tense · "+NAMES[m];
function status(m,k){
  if((store("cv-done-"+k)||[]).includes(m))return"done";
  const p=store("cv-prog-"+k+(m==="inf"?"":"-"+m));
  return p&&Object.keys(p).length?"prog":"new";
}
function home(){
  $("play").hidden=true;$("story").hidden=true;$("home").hidden=false;
  const p=prof(),h=today.getHours();
  $("avatar").textContent=p.av;
  $("hello").textContent=(h<12?"Buongiorno":h<18?"Buon pomeriggio":"Buonasera")+(p.name?", "+p.name:"")+"!";
  $("hdate").textContent=today.toLocaleDateString(undefined,DAYF);
  const s=store("cv-streak")||{};
  $("st1").textContent=liveStreak();
  $("st2").textContent=Math.max(s.best||0,s.n||0);
  let tot=0;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("cv-done-"))tot+=(JSON.parse(localStorage.getItem(k))||[]).length}}catch(e){}
  $("st3").textContent=tot;
  $("dayh").textContent=KEY===TODAY?"Today’s puzzles":"Puzzles for "+pd(KEY).toLocaleDateString(undefined,DAYF);
  const c=$("cards");c.innerHTML="";
  let first=null;
  MODES.forEach(m=>{
    const st=status(m,KEY),b=document.createElement("button");
    b.className="card "+st;
    b.innerHTML='<span class="ic">'+(m==="inf"?"-are":NAMES[m])+'</span><span class="tx"><b>'+mlabel(m)+'</b><small>'+(m==="inf"?"100 common verbs":"Subject: "+WHO[m])+'</small></span><span class="stt">'+({done:"✓ Done",prog:"Continue",new:"Play"})[st]+'</span>';
    b.onclick=()=>openPuzzle(m);c.append(b);
    if(first===null&&st!=="done")first=m;
  });
  const ct=$("cont");
  ct.disabled=first===null;
  ct.textContent=first===null?"All puzzles done for this day 🎉":(status(first,KEY)==="prog"?"Continue: ":"Start: ")+mlabel(first);
  ct.onclick=()=>first!==null&&openPuzzle(first);
  learn();cal();
  window.scrollTo(0,0);
}
function openPuzzle(m){
  $("home").hidden=true;$("play").hidden=false;
  $("date").textContent=pd(KEY).toLocaleDateString(undefined,DAYF);
  load(m);showStreak();window.scrollTo(0,0);
}
function cal(){
  const y=calM.getFullYear(),mo=calM.getMonth(),lead=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),ym=fmt(calM).slice(0,7);
  let h='<div class="ch"><button id="pm"'+(ym<=LAUNCH.slice(0,7)?" disabled":"")+'>‹</button><b>'+calM.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</b><button id="nm"'+(ym>=TODAY.slice(0,7)?" disabled":"")+'>›</button><button id="tdy">Today</button></div><div class="cg">';
  "MTWTFSS".split("").forEach(x=>h+="<i>"+x+"</i>");
  for(let i=0;i<lead;i++)h+="<span></span>";
  for(let n=1;n<=days;n++){
    const k=fmt(new Date(y,mo,n)),ok=k>=LAUNCH&&k<=TODAY,c=ok?(store("cv-done-"+k)||[]).length:0;
    h+='<button class="d'+(k===KEY?" sel":"")+(k===TODAY?" td":"")+(c>=7?" full":c?" part":"")+'"'+(ok?' data-k="'+k+'"':" disabled")+'>'+n+(c?"<small>"+c+"/7</small>":"")+"</button>";
  }
  $("cal").innerHTML=h+"</div>";
  $("pm").onclick=()=>{calM=new Date(y,mo-1,1);cal()};
  $("nm").onclick=()=>{calM=new Date(y,mo+1,1);cal()};
  $("tdy").onclick=()=>{KEY=TODAY;calM=new Date(today.getFullYear(),today.getMonth(),1);home()};
  document.querySelectorAll("#cal [data-k]").forEach(b=>b.onclick=()=>{KEY=b.dataset.k;home()});
}
function avs(){
  $("avs").innerHTML="";
  AVS.forEach(a=>{const b=document.createElement("button");b.textContent=a;if(a===pav)b.className="on";b.onclick=()=>{pav=a;avs()};$("avs").append(b)});
}
$("avatar").onclick=()=>{const p=prof();$("pname").value=p.name;pav=p.av;$("prof").hidden=!$("prof").hidden;avs()};
$("psave").onclick=()=>{store("cv-profile",{name:$("pname").value.trim(),av:pav});$("prof").hidden=true;home()};
